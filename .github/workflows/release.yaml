name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - name: Derive version info
        id: version
        run: |
          # Strip the 'v' prefix
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          
          # Logic: If tag contains a hyphen (e.g. 1.0.0-beta.1), it's a pre-release
          if [[ "$VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "Detected Pre-release: Yes"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "Detected Pre-release: No"
          fi

      - name: Build multi-platform archives
        run: |
          set -euo pipefail

          mkdir -p dist
          BUILD_TAGS="grammar_set_core"

          # Loop over platforms
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              
              # Windows extension handling
              bin_name="lx"
              ext=""
              if [ "$GOOS" = "windows" ]; then
                ext=".exe"
                bin_name="lx.exe"
              fi

              # The final asset name (e.g., lx-v1.0.0-linux-amd64)
              asset_name="lx-${VERSION}-${GOOS}-${GOARCH}${ext}"
              
              echo "Building $asset_name ..."

              # Use the curated Core100 Tree-sitter grammar set to reduce binary size.
              # make will inherit GOOS/GOARCH/GOFLAGS from the env vars below.
              GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 \
              GOFLAGS="-trimpath -buildvcs=false -tags=${BUILD_TAGS}" \
              make build \
                VERSION=${VERSION} \
                OR_OUT="$asset_name"

              # Archive naming
              archive="lx_${VERSION}_${GOOS}_${GOARCH}"

              # Create archive including the binary, README, and LICENSE
              if [ "$GOOS" = "windows" ]; then
                zip "dist/${archive}.zip" "$asset_name" README.md LICENSE
              else
                tar -czf "dist/${archive}.tar.gz" "$asset_name" README.md LICENSE
              fi

              # Cleanup the raw binary so it doesn't clutter the next loop
              rm "$asset_name"
            done
          done
          
          # Generate checksums
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # This reads the flag we calculated in step 3
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
