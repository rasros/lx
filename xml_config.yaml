# lx XML Configuration

template: |
  {{ .Separator }}<document index="{{ .FileIndex }}"{{ if .Language }} language="{{ .Language }}"{{ end }} rows="{{ .TotalRows }}">
    <source>{{ .Path }}</source>
    {{- if .IsBinary }}
    <error>Binary file ({{ .Size | humanize }})</error>
    {{- else if .IsCompactView }}
    <description>Compact view</description>
    {{- else }}
    <document_content>
  {{ .Content | endNewline }}  </document_content>
    {{- end }}
  </document>

section_template: |
  {{ .Separator }}<section_header>
  {{ .Body | endNewline -}}
  </section_header>

prompt_template: |
  {{ .Separator }}<instruction>
  {{ .Body | endNewline -}}
  </instruction>