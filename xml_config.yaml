template: |
  <document index="{{ .FileIndex }}"{{ if .Language }} language="{{ .Language }}"{{ end }} rows="{{ .TotalRows }}">
    <source>{{ .Path }}</source>
    {{- if .IsBinary }}
    <error>Binary file ({{ .Size | humanize }})</error>
    {{- else if .IsCompactView }}
    <description>Compact view</description>
    {{- else }}
    <document_content>
  {{ .Content | endNewline }}    </document_content>
    {{- end }}
  </document>{{ "\n" }}

section_template: |
  <section_header>
  {{ .Body | endNewline -}}
  </section_header>{{ "\n" }}

prompt_template: |
  <instruction>
  {{ .Body | endNewline -}}
  </instruction>{{ "\n" }}