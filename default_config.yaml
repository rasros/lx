# ------------------------------------------------------------------
# lx Default Configuration
# ------------------------------------------------------------------

# Main file template
# Matches internal default:
# - Handles binary files gracefully
# - Hides [1/N] index if only one file is processed
# - Adds appropriate spacing between files
template: |
  {{ if .IsBinary -}}
  {{ if gt .TotalFiles 1 }}[{{ .FileIndex }}/{{ .TotalFiles }}] {{ end }}{{ .Path }} - binary file skipped ({{ .Size | humanize }})

  {{ else -}}
  {{ if gt .TotalFiles 1 }}[{{ .FileIndex }}/{{ .TotalFiles }}] {{ end }}{{ .Path }} ({{ .TotalRows }} rows)
  ---
  ```{{ .Language }}
  {{ .Content | endNewline -}}
  ```

  {{ end -}}

# Section Header Template (-s flag)
section_template: |
  ## {{ .Body | endNewline }}

# Prompt Template (-p flag)
prompt_template: |
  {{ .Body | endNewline }}

