# lx Default Configuration
# Place this file at:
#   - Linux/Mac: ~/.config/lx/config.yaml
#   - Windows: %APPDATA%\lx\config.yaml
#   - Or set LX_CONFIG environment variable to point to this file.

# The main template used for rendering files.
template: |
  {{ if eq .Size 0 }}{{ if gt .Global.TotalFiles 1 }}[{{ .FileIndex }}/{{ .Global.TotalFiles }}] {{ end }}{{ .Path }} - empty file
  {{ else if .IsBinary }}{{ if gt .Global.TotalFiles 1 }}[{{ .FileIndex }}/{{ .Global.TotalFiles }}] {{ end }}{{ .Path }} - binary file ({{ .Size | humanize }})
  {{ else if .IsCompactView }}{{ if gt .Global.TotalFiles 1 }}[{{ .FileIndex }}/{{ .Global.TotalFiles }}] {{ end }}{{ .Path }} ({{ if .IsEstimate }}~{{ end }}{{ .TotalRows }} rows)
  {{ else }}{{ if gt .Global.TotalFiles 1 }}[{{ .FileIndex }}/{{ .Global.TotalFiles }}] {{ end }}{{ .Path }} ({{ if .IsEstimate }}~{{ end }}{{ .TotalRows }} rows)
  ---
  ```{{ .Language }}
  {{ .Content | endNewline -}}```
  
  {{ end }}

# Template used when the -s/--section flag is provided.
section_template: |
  ## {{ .Body | endNewline }}---


# Template used when the -p/--prompt flag is provided.
prompt_template: |
  {{ .Body | endNewline }}


# Template used for the summary stats (printed to stderr, or stdout if redirected).
stats_template: |
  Files: {{ .Global.TotalFiles }}
  Size: {{ .Global.TotalSize | humanize }}
  Est. Tokens: {{ .Global.TokenEstimate }}


# Output mode.
# Options:
#   "stdout" (default) - Print to stdout.
#   "copy"   - Copy to system clipboard.
output_mode: "stdout"

# Stats display mode.
# Options:
#   "auto"   (default) - Show stats only when output is redirected (file/clipboard).
#   "always" - Always show stats (equivalent to --stats).
#   "never"  - Never show stats (equivalent to --no-stats).
show_stats: "auto"

# Logging verbosity.
# Options: "debug", "info", "warn", "error", "silent".
# Default is "warn" (shows errors and warnings).
verbosity: "warn"

# Output format.
# Options:
#   "markdown" (default) - Print markdown.
#   "xml"                - Claude style XML.
output_format: "markdown"

# Discovery Options

# Follow symbolic links during directory traversal.
# Equivalent to -L / --follow flag.
follow_symlinks: false

# Include hidden files and directories (starting with ".").
# Equivalent to -H / --hidden flag.
show_hidden: false

# Respect .gitignore, .ignore, and .lxignore files.
# Set to false to include ignored files.
# Equivalent to the inverse of -I / --no-ignore flag.
ignore: true