# lx Default Configuration (Markdown)
# -----------------------------------------------------------------------------
# File Templates
# -----------------------------------------------------------------------------

# Shared partial for file headers (e.g. "[1/5] path/to/file")
file_header_template: |-
  {{ if gt .Section.TotalFiles 1 }}[{{ .SectionFileIndex }}/{{ .Section.TotalFiles }}] {{ end }}{{ .Path }}

# Renders standard file content
file_content_template: |-
  {{ template "file_header" . }} ({{ if .IsEstimate }}~{{ end }}{{ .TotalRows }} rows{{ if .SkeletonMode }}, {{ .SkeletonMode }}{{ end }})
  ---
  ```{{ .Language }}
  {{ .Content | endNewline -}}```

# Renders when a file cannot be read
file_error_template: |-
  {{ template "file_header" . }} - error: {{ .ReadError }}

# Renders when a binary file is detected
file_binary_template: |-
  {{ template "file_header" . }} - binary file skipped ({{ .Size | humanize }})

# Renders when in compact mode (-n 0)
file_compact_template: |-
  {{ template "file_header" . }} ({{ if .IsEstimate }}~{{ end }}{{ .TotalRows }} rows{{ if .SkeletonMode }}, {{ .SkeletonMode }}{{ end }})

# -----------------------------------------------------------------------------
# Item Templates
# -----------------------------------------------------------------------------

# Separator between files/groups (Markdown style)
section_template: |-
  ## {{ .Body | endNewline }}---

# Custom prompts (-p)
prompt_template: |-
  {{ .Body | endNewline }}

# Tree output (-t / -T)
tree_template: |-
  ```
  {{ .Body | endNewline -}}```

# -----------------------------------------------------------------------------
# Global & Wrapper Templates
# -----------------------------------------------------------------------------

output_header_template: ""
output_footer_template: "\n\n"

# Markdown doesn't use section wrappers
section_header_template: ""
section_footer_template: ""

stats_template: |
  Files: {{ .Global.TotalFiles }}
  Size: {{ .Global.TotalWrittenBytes | humanize }}
  Est. Tokens: {{ .Global.TokenEstimate }}

# -----------------------------------------------------------------------------
# Options
# -----------------------------------------------------------------------------

# Where to send rendered output by default. CLI flags (-c, -C, -o) override.
# values: stdout | copy
output_mode: "stdout"

# When to print the file/token summary footer. CLI: --stats / --no-stats / -q.
# values: auto | always | never
show_stats: "auto"

# Default log level. CLI: -v, -vv, --verbose=<level>, -q.
# values: debug | info | warn | error | silent  (or numeric 0|1|2+)
verbosity: "warn"

# Output format. CLI: --md, --xml, --html, --bare.
# values: markdown | xml | html | bare
output_format: "markdown"

# Directory containing reusable prompts loaded by -P/--prompt-file.
# Override at runtime with --prompts-dir or $LX_PROMPTS_DIR.
# prompts_dir: "~/.config/lx/prompts"

# Extensions probed by -P when resolving "<value>" against prompts_dir.
# prompt_extensions: [".md", ".txt", ".prompt"]
